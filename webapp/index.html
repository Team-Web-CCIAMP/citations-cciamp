<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi citations IA — CCIAMP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, sans-serif; background:#0f1117; color:#e8e8ef; margin:0; padding:2rem; max-width:900px; margin-inline:auto; }
  h1 { font-size:1.5rem; margin-bottom:0.2rem; }
  h2 { font-size:1.1rem; margin-top:2rem; }
  .sub { color:#9a9ab0; margin-bottom:1.5rem; }
  .cards { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .card { background:#1b1e2b; border-radius:12px; padding:1rem 1.4rem; min-width:150px; }
  .card .big { font-size:2rem; font-weight:700; }
  .card .lbl { color:#9a9ab0; font-size:0.85rem; }
  .badge { display:inline-block; background:#26304a; padding:0.35rem 0.7rem; border-radius:999px; margin:0.2rem 0.2rem 0.2rem 0; font-size:0.85rem; }
  .badge.muted { background:#20222e; color:#7d7d90; }
  table { width:100%; border-collapse:collapse; margin-top:1rem; font-size:0.9rem; }
  th, td { text-align:left; padding:0.5rem 0.6rem; border-bottom:1px solid #262838; }
  th { color:#9a9ab0; font-weight:600; }
  .yes { color:#4ade80; font-weight:700; }
  .no { color:#5a5a6e; }
  canvas { background:#1b1e2b; border-radius:12px; padding:1rem; max-width:100%; }
  form { background:#1b1e2b; border-radius:12px; padding:1.4rem; display:grid; gap:0.8rem; margin-top:1rem; }
  label { font-size:0.85rem; color:#9a9ab0; display:block; margin-bottom:0.3rem; }
  input, select, textarea { width:100%; box-sizing:border-box; background:#0f1117; border:1px solid #2a2d3d; color:#e8e8ef; border-radius:8px; padding:0.6rem 0.7rem; font-family:inherit; font-size:0.95rem; }
  textarea { min-height:90px; resize:vertical; }
  button { background:#4ade80; color:#0f1117; border:none; border-radius:8px; padding:0.7rem 1.2rem; font-weight:700; cursor:pointer; font-size:0.95rem; }
  button:disabled { opacity:0.6; cursor:wait; }
  #toast { margin-top:0.8rem; font-size:0.9rem; }
</style>
</head>
<body>
  <h1>🔎 Suivi des citations IA — CCIAMP</h1>
  <div class="sub">Une seule page pour consulter les résultats et ajouter un test.</div>

  <div class="cards">
    <div class="card"><div class="big" id="score">–</div><div class="lbl">Score du dernier passage</div></div>
    <div class="card"><div class="big" id="streak">–</div><div class="lbl">Streak (passages consécutifs cités)</div></div>
    <div class="card"><div class="big" id="runsCount">–</div><div class="lbl">Passages historisés</div></div>
  </div>

  <div id="badges"></div>

  <canvas id="trend" height="90"></canvas>

  <div id="leaderboardWrap"></div>

  <h2>Détail du dernier passage</h2>
  <table id="detail-table">
    <thead><tr><th>LLM</th><th>Requête</th><th>Cité ?</th><th>Extrait</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>➕ Ajouter un test</h2>
  <form id="testForm">
    <div>
      <label>Ton prénom</label>
      <input name="author" required>
    </div>
    <div>
      <label>LLM testé</label>
      <select name="llm" required>
        <option>ChatGPT</option>
        <option>Perplexity</option>
        <option>Gemini</option>
        <option>Claude</option>
        <option>Autre</option>
      </select>
    </div>
    <div>
      <label>Nom court de la requête testée</label>
      <input name="label" required placeholder="ex : Formation pro Aix-Marseille">
    </div>
    <div>
      <label>Question posée au LLM</label>
      <textarea name="prompt" required></textarea>
    </div>
    <div>
      <label>Réponse complète collée du LLM</label>
      <textarea name="response" required></textarea>
    </div>
    <button type="submit">Enregistrer ce test</button>
    <div id="toast"></div>
  </form>

<script>
// ⚙️ Seules lignes à modifier si un jour tu changes de dépôt GitHub ou de domaine suivi.
const OWNER = "REMPLACE_PAR_TON_PSEUDO_GITHUB";
const REPO = "REMPLACE_PAR_TON_NOM_DE_DEPOT";
const DOMAIN = "cciamp.com";

async function loadHistory() {
  const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/history.json?t=${Date.now()}`;
  const res = await fetch(url);
  if (!res.ok) return [];
  return res.json();
}

function computeStats(history) {
  if (!history.length) return { runs: [], streak: 0, score: 0, badges: [], leaderboard: [] };
  const byDate = {};
  history.forEach(e => { (byDate[e.date] ||= []).push(e); });
  const dates = Object.keys(byDate).sort();
  const runs = dates.map(d => {
    const entries = byDate[d];
    const cited = entries.filter(e => e.domain_cited_as_source || e.domain_mentioned_in_text).length;
    return { date: d, cited, total: entries.length };
  });
  let streak = 0;
  for (let i = runs.length - 1; i >= 0; i--) { if (runs[i].cited > 0) streak++; else break; }
  const last = runs[runs.length - 1];
  const score = last.total ? Math.round(100 * last.cited / last.total) : 0;

  const badges = [];
  if (streak >= 3) badges.push(`🔥 ${streak} suivis consécutifs avec citation`);
  if (score === 100) badges.push("🏆 Score parfait sur le dernier passage");
  if (runs.length >= 2 && runs[runs.length-1].cited > runs[runs.length-2].cited) badges.push("📈 Progression depuis le dernier suivi");
  const lastDate = last.date;
  const newCitations = history.filter(e => e.date === lastDate && (e.domain_cited_as_source || e.domain_mentioned_in_text));
  if (newCitations.length) badges.push(`✨ ${newCitations.length} citation(s) détectée(s) ce passage`);

  const leadCount = {};
  history.forEach(e => { const a = (e.author || "").trim(); if (a) leadCount[a] = (leadCount[a]||0) + 1; });
  const leaderboard = Object.entries(leadCount).sort((a,b) => b[1]-a[1]);

  return { runs, streak, score, badges, leaderboard, lastDate };
}

function render(history) {
  const stats = computeStats(history);
  document.getElementById('score').textContent = stats.runs.length ? stats.score + '%' : '–';
  document.getElementById('streak').textContent = stats.streak;
  document.getElementById('runsCount').textContent = stats.runs.length;

  const badgesEl = document.getElementById('badges');
  badgesEl.innerHTML = stats.badges.length
    ? stats.badges.map(b => `<span class="badge">${b}</span>`).join('')
    : '<span class="badge muted">Pas encore de badge — au prochain passage !</span>';

  if (window._chart) window._chart.destroy();
  window._chart = new Chart(document.getElementById('trend'), {
    type: 'line',
    data: {
      labels: stats.runs.map(r => r.date),
      datasets: [
        { label: `Requêtes citant ${DOMAIN}`, data: stats.runs.map(r => r.cited), borderColor:'#4ade80', backgroundColor:'rgba(74,222,128,0.15)', tension:0.3, fill:true },
        { label: 'Total requêtes testées', data: stats.runs.map(r => r.total), borderColor:'#5a5a6e', borderDash:[4,4], tension:0.3 }
      ]
    },
    options: {
      plugins: { legend: { labels: { color: '#e8e8ef' } } },
      scales: {
        x: { ticks: { color:'#9a9ab0' }, grid: { color:'#262838' } },
        y: { ticks: { color:'#9a9ab0' }, grid: { color:'#262838' }, beginAtZero:true }
      }
    }
  });

  const lbWrap = document.getElementById('leaderboardWrap');
  if (stats.leaderboard.length) {
    const medals = ['🥇','🥈','🥉'];
    lbWrap.innerHTML = `<h2>🏆 Chasseurs de citations</h2><table><thead><tr><th></th><th>Contributeur·rice</th><th>Tests réalisés</th></tr></thead><tbody>${
      stats.leaderboard.slice(0,8).map(([name,count],i) => `<tr><td>${medals[i]||''}</td><td>${name}</td><td>${count}</td></tr>`).join('')
    }</tbody></table>`;
  } else {
    lbWrap.innerHTML = '';
  }

  const tbody = document.querySelector('#detail-table tbody');
  const lastEntries = history.filter(e => e.date === stats.lastDate);
  tbody.innerHTML = lastEntries.map(e => {
    const cited = e.domain_cited_as_source || e.domain_mentioned_in_text;
    return `<tr><td>${e.llm}</td><td>${e.label}</td><td class="${cited?'yes':'no'}">${cited?'✅ Oui':'— Non'}</td><td>${(e.excerpt||'').slice(0,140)}…</td></tr>`;
  }).join('');
}

async function refresh() {
  const history = await loadHistory();
  render(history);
}

document.getElementById('testForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const btn = form.querySelector('button');
  const toast = document.getElementById('toast');
  btn.disabled = true;
  toast.textContent = '⏳ Enregistrement en cours…';
  const data = Object.fromEntries(new FormData(form).entries());
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Erreur inconnue');
    toast.textContent = json.cited ? '🎉 Enregistré — cciamp.com a été trouvé dans la réponse !' : '✅ Enregistré — pas de citation détectée cette fois.';
    form.reset();
    setTimeout(refresh, 1500); // laisse le temps au commit GitHub de se propager
  } catch (err) {
    toast.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

refresh();
</script>
</body>
</html>
